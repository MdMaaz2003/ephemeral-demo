apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: my-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  rules:
  - host: {{ .Values.ingress.host }}

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: my-app
            port:
              number: {{ .Values.service.port }}